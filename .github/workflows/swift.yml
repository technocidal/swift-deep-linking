name: Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4
    - name: Setup Swift 6.4
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.4.2"
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
